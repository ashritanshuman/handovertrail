services:
  - type: web
    name: handovertrail
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt && cd ../frontend && npm install && npm run build"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NODE_VERSION
        value: "20.18.0"
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: "gemini-2.5-flash"
      - key: DATABASE_URL
        value: "sqlite:///./handovertrail.db"
      - key: FRONTEND_DIST
        value: "../frontend/dist"
      - key: ENVIRONMENT
        value: "production"
