services:
  - type: web
    name: handovertrail
    env: python
    buildCommand: "make build"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: LLM_MODEL
        value: "claude-sonnet-5-5"
      - key: DATABASE_URL
        value: "sqlite:///./handovertrail.db"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: "production"
